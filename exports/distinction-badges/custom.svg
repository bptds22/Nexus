<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="2 2 76 76" preserveAspectRatio="xMidYMax meet">
  <title>Texte personnalisé</title>
  <defs>
    <style>
      @keyframes svgSweep {
        0%   { transform: translateX(-120%); }
        60%  { transform: translateX(120%); }
        100% { transform: translateX(120%); }
      }
      .badge-shimmer { animation: svgSweep 3s ease-in-out infinite; }
    </style>
    <clipPath id="clip-custom">
      <circle cx="40" cy="40" r="36" />
    </clipPath>
  </defs>
  <circle cx="40" cy="40" r="38" fill="#B71C1C" />
  <circle cx="40" cy="40" r="36" fill="#B71C1C" />
  <circle cx="40" cy="40" r="27" fill="#E63946" />
  <circle cx="40" cy="40" r="18" fill="#B71C1C" />
  <circle cx="40" cy="40" r="8" fill="#E63946" />
  <g clip-path="url(#clip-custom)">
    <rect class="badge-shimmer" x="-30" y="0" width="30" height="80" fill="rgba(255,255,255,0.12)" transform="skewX(-20)" />
  </g>
</svg>
