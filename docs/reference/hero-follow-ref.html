<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Hero + Suivre / preuve sociale (réf pass 1)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,800;1,800&family=Outfit:wght@400;500;600;700&family=Permanent+Marker&display=swap');

:root{
  --red:#A6192E; --red-deep:#7E1122; --ink:#191414;
  --cream:#F1EBDD; --kraft:#E6DBC2;
  --nx-red:#E63946;          /* rouge Nexus — moments plateforme */
  --green:#22C55E;
  --pop:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0C0E;color:var(--cream);font-family:'Barlow Condensed',sans-serif;padding:26px 14px}
.cap{max-width:1180px;margin:0 auto 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6a6f78;font-weight:700;font-family:'Outfit'}

section{position:relative;z-index:2;padding:64px 26px 56px;border-bottom:1px solid #1E2129;overflow:hidden;background:#111317;max-width:1232px;margin:0 auto;border-radius:16px}
.sec-in{max-width:1180px;margin:0 auto;position:relative}
.pbar{width:100px;height:9px;background:repeating-conic-gradient(var(--red) 0 25%,transparent 0 50%) 0 0/9px 9px;margin:14px 0 8px}

/* --- id + follow row --- */
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.bigid .l1x{font-family:'Anton';font-size:clamp(26px,2.6vw,36px);color:var(--red);filter:brightness(1.3);text-transform:uppercase;line-height:1}
.bigid .l2x{font-family:'Anton';font-size:clamp(44px,5.4vw,76px);color:#EDEFF3;text-transform:uppercase;line-height:1;margin-top:2px}

/* === NOUVEAU — barre Suivre + preuve sociale (moment plateforme = rouge Nexus) === */
.hfollow{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:230px}
.hf-stats{display:flex;gap:8px}
.hf-chip{display:inline-flex;align-items:center;gap:7px;background:#1A1D24;border:1.5px solid #262A33;border-radius:11px;
  padding:9px 13px;font-family:'Outfit';font-weight:700;font-size:14px;color:#EDEFF3}
.hf-chip .ic{font-size:14px;line-height:1}
.hf-chip .ic.eye{color:#8A909C}
.hf-chip .ic.heart{color:var(--nx-red)}
.hf-chip .u{font-family:'Outfit';font-weight:500;font-size:11px;color:#8A909C;margin-left:1px}
.hf-btn{display:inline-flex;align-items:center;gap:9px;font-family:'Outfit';font-weight:700;font-size:15px;
  background:var(--nx-red);color:#fff;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;
  transition:transform .28s var(--pop),background .2s;box-shadow:0 6px 20px -8px rgba(230,57,70,.7);white-space:nowrap}
.hf-btn:hover{transform:translateY(-2px)}
.hf-btn.on{background:#14161C;color:#EDEFF3;border:1.5px solid #2A2F3A;box-shadow:none}
.hf-btn.on .p{color:var(--green)}
.hf-note{font-family:'Outfit';font-weight:600;font-size:12px;color:#8A909C;text-align:right;max-width:230px}
.hf-note b{color:#C9CCD4}

/* --- 3 rangées type-block --- */
.tstack{margin:32px -26px 0}
.trow{display:flex;align-items:baseline;gap:22px;padding:26px 8%;line-height:1}
.trow .big{font-family:'Anton';font-size:clamp(46px,5.6vw,78px)}
.trow .lab{font-family:'Bebas Neue';letter-spacing:.18em;font-size:clamp(14px,1.4vw,19px);opacity:.85}
.tr-ink{background:#191414;color:#EDEFF3}
.tr-red{background:var(--red);color:#fff}
.tr-cream{background:#EFF1F4;color:#15171B}
.tr-cream .big{color:var(--red)}
.man{display:inline-block;font-family:'Outfit';font-weight:600;font-size:10px;letter-spacing:.12em;color:#8A909C;
  border:1px dashed #3a3f49;border-radius:6px;padding:2px 7px;margin-left:14px;vertical-align:middle;text-transform:uppercase}
.tr-red .man{color:#fff;border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>

<div class="cap">Réf pass 1 — Hero : Suivre (→ mes cibles) + preuve sociale · données réelles Grasset · rouge Nexus = plateforme</div>

<section id="apercu">
  <div class="sec-in">
    <div class="hd-top">
      <div class="bigid">
        <div class="l1x">Collège</div>
        <div class="l2x">André-Grasset</div>
        <div class="pbar"></div>
      </div>

      <!-- NOUVEAU : preuve sociale + Suivre -->
      <div class="hfollow">
        <div class="hf-stats">
          <span class="hf-chip"><span class="ic eye">👁</span>1 240<span class="u">vues</span></span>
        </div>
        <button class="hf-btn" id="followBtn" onclick="follow(this)">
          <span class="p">♥</span><span class="t">Rajouter dans mes cibles</span>
        </button>
        <div class="hf-note"><b>86 athlètes</b> suivent ce collège</div>
      </div>
    </div>

    <div class="tstack">
      <div class="trow tr-ink"><span class="big">13</span><span class="lab">ÉQUIPES PHÉNIX</span></div>
      <div class="trow tr-red"><span class="big">250+</span><span class="lab">ÉTUDIANTS-ATHLÈTES</span><span class="man">saisie collège</span></div>
      <div class="trow tr-cream"><span class="big" style="font-size:clamp(38px,4.6vw,64px)">MONTRÉAL</span><span class="lab">AHUNTSIC · QC</span></div>
    </div>
  </div>
</section>

<script>
function follow(b){
  const on=b.classList.toggle('on');
  b.querySelector('.p').textContent=on?'✓':'♥';
  b.querySelector('.t').textContent=on?'Dans tes cibles':'Rajouter dans mes cibles';
}
</script>
</body>
</html>
