<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Athlete Card Final</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --navy:        #1E2128;   /* Near Black */
  --card-bg:     #2F3440;   /* Charcoal */
  --blue:        #E64B47;   /* Accent Red */
  --blue-hover:  #FF6B67;   /* Red lighter */
  --white:       #FFFFFF;
  --text-sec:    #9CA3AF;   /* Muted gray */
  --border:      #3D4452;   /* Charcoal border */
  --cream:       #FFFFFF;   /* White ticket */
  --cream-dark:  #E6E6E6;   /* Light Gray */
  --amber:       #F59E0B;
  --green:       #22C55E;
}

body {
  background: #1E2128;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  padding: 80px 40px;
  flex-wrap: wrap;
  font-family: 'Barlow', sans-serif;
}

/* ═══════════════════════════════
   CARD WRAPPER
═══════════════════════════════ */
.card-wrap {
  position: relative;
  width: 340px;
  /* extra room for pennant overflow top + ticket overflow bottom */
  padding-top: 6px;
  padding-bottom: 10px;
}

/* ── MAIN CARD ── */
.card {
  position: relative;
  width: 340px;
  border-radius: 10px;
  overflow: visible;
  transform: rotate(-2deg);
  transition: transform 0.4s cubic-bezier(.22,.68,0,1.2),
              box-shadow 0.4s ease;
  box-shadow:
    0 0 0 1.5px var(--border),
    0 20px 60px rgba(0,0,0,0.7),
    0 0 0 0 rgba(37,99,235,0);
}
.card:hover {
  transform: rotate(-1deg) translateY(-8px);
  box-shadow:
    0 0 0 1.5px var(--blue),
    0 30px 80px rgba(0,0,0,0.8),
    0 0 40px rgba(230,75,71,0.3),
    0 0 80px rgba(230,75,71,0.12);
}

/* ── PHOTO AREA ── */
.card__photo {
  width: 340px;
  height: 420px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  z-index: 0;
  background: var(--card-bg);
}

.card__photo-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  z-index: 1;
}

/* Bottom gradient */
.card__photo-fade {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to top,
    rgba(11,18,32,0.97) 0%,
    rgba(11,18,32,0.7) 35%,
    transparent 100%);
  z-index: 2;
}



/* Corner fold */
.card__photo::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 0 20px 20px 0;
  border-color: transparent #1E2128 transparent transparent;
  z-index: 20;
  border-radius: 0 10px 0 0;
}

/* ═══════════════════════════════
   PENNANT FLAG — top left, bigger
═══════════════════════════════ */

.card-wrap:hover 

/* ═══════════════════════════════
   VERIFIED PIN — top right
   TikTok starburst 3D lapel pin
═══════════════════════════════ */

.card-wrap:hover 

.card-wrap:hover 

/* ═══════════════════════════════
   TICKET — unified, bottom right
═══════════════════════════════ */



/* Real ticket */
.ticket {
  position: absolute;
  bottom: -16px;
  right: -26px;
  z-index: 999;
  transform: rotate(3.5deg);
  box-shadow: 2px 6px 18px rgba(0,0,0,0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border-radius: 4px;
  overflow: hidden;
  border: 1.5px solid rgba(255,255,255,0.08);
}
.card-wrap:hover .ticket {
  transform: rotate(2deg) translateX(-4px) translateY(-2px);
  box-shadow: 3px 8px 22px rgba(0,0,0,0.7);
}

.ticket__inner {
  display: flex;
  width: 364px;
}

/* Left col — dark navy, sport/pos/div */
.ticket__left {
  background: var(--navy);
  padding: 14px 16px 14px 18px;
  min-width: 109px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 5px;
}

.ticket__row {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.t-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  margin-bottom: 2px;
}
.t-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: #fff;
  letter-spacing: 0.06em;
  line-height: 1;
}

/* Perforation */
.ticket__perf {
  width: 12px;
  background: var(--cream-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-left: 1.5px dashed rgba(11,18,32,0.2);
  border-right: 1.5px dashed rgba(11,18,32,0.2);
  position: relative;
}
/* Punch holes top/bottom */
.ticket__perf::before,
.ticket__perf::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #1E2128;
  left: 50%;
  transform: translateX(-50%);
}
.ticket__perf::before { top: -5px; }
.ticket__perf::after  { bottom: -5px; }

.ticket__perf span {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(11,18,32,0.2);
  flex-shrink: 0;
}

/* Right col — cream, player info */
.ticket__right {
  background: var(--cream);
  padding: 12px 18px 12px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0px;
  min-width: 0;
}

.ticket__name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--navy);
  letter-spacing: 0.05em;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ticket__school {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-sec);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
}
.ticket__meta {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--blue);
  margin-top: 1px;
}

/* Stub */
.ticket__stub {
  background: var(--blue);
  width: 26px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ═══════════════════════════════
   STAR RATING (top of card)
═══════════════════════════════ */

/* ═══════════════════════════════
   ACTIVITY DOT (inside photo)
═══════════════════════════════ */



/* ═══════════════════════════════
   VERIFIED BADGE — bottom left
═══════════════════════════════ */
.badge-wrap {
  position: absolute;
  top: 12px;
  right: -14px;
  z-index: 30;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.55));
  transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), filter 0.35s ease;
}
.card-wrap:hover .badge-wrap {
  transform: scale(1.12) rotate(-6deg);
  filter: drop-shadow(0 6px 18px rgba(230,75,71,0.55));
}
</style>
<body>

<div class="card-wrap">

  <!-- ── VERIFIED BADGE ── -->
  <div class="badge-wrap">
    <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg_grad" cx="38%" cy="28%" r="68%">
          <stop offset="0%"   stop-color="#29AAFF"/>
          <stop offset="55%"  stop-color="#0094F0"/>
          <stop offset="100%" stop-color="#0060C0"/>
        </radialGradient>
        <radialGradient id="shine" cx="38%" cy="25%" r="55%">
          <stop offset="0%"  stop-color="rgba(255,255,255,0.32)"/>
          <stop offset="60%" stop-color="rgba(255,255,255,0.0)"/>
        </radialGradient>
      </defs>
      <!-- Outer dark ring -->
      <circle cx="27" cy="27" r="26" fill="#0060C0" opacity="0.35"/>
      <!-- Main circle -->
      <circle cx="27" cy="27" r="24" fill="url(#bg_grad)"/>
      <!-- Glass sheen -->
      <circle cx="27" cy="27" r="24" fill="url(#shine)"/>
      <!-- White border -->
      <circle cx="27" cy="27" r="24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <!-- Checkmark — bold, centered, black fill like reference -->
      <path d="M16,27 L22,34 L38,18"
            stroke="#FFFFFF" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none"/>
    </svg>
  </div>



  <!-- CARD: Alexis Morin · LB · D2 · 3★ -->
  <!-- Card 1 animation (CSS default -2deg, hover -1deg + lift + blue glow) -->
  <!-- Card 2 photo angle (background-position: center) -->
  <!-- Card 3 layout (LB / D2 / Laval / Class 2027 / 3 stars) -->
  <div class="card">
    <div class="card__photo">
      <div class="card__photo-img" style="background-image:url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=700&q=80&fit=crop');background-position:center;"></div>
      <div class="card__photo-fade"></div>
    </div>



    <!-- Real ticket -->
    <div class="ticket">
      <div class="ticket__inner">
        <div class="ticket__left">
          <div class="ticket__row">
            <span class="t-label">Sport</span>
            <span class="t-val">Football</span>
          </div>
          <div class="ticket__row">
            <span class="t-label">Pos</span>
            <span class="t-val">LB</span>
          </div>
          <div class="ticket__row">
            <span class="t-label">Div</span>
            <span class="t-val">D2</span>
          </div>
        </div>
        <div class="ticket__perf">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span>
        </div>
        <div class="ticket__right">
          <div class="ticket__name">Alexis Morin</div>
          <!-- 3 stars -->
          <svg width="122" height="20" viewBox="0 0 122 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-top:7px;margin-bottom:4px">
            <path d="M8,0L9.8,5.8L16,5.8L11,9.2L13,15L8,11.8L3,15L5,9.2L0,5.8L6.2,5.8Z" fill="#F5C518"/>
            <path d="M8,0L9.8,5.8L16,5.8L11,9.2L13,15L8,11.8L3,15L5,9.2L0,5.8L6.2,5.8Z" fill="#F5C518" transform="translate(25,0)"/>
            <path d="M8,0L9.8,5.8L16,5.8L11,9.2L13,15L8,11.8L3,15L5,9.2L0,5.8L6.2,5.8Z" fill="#F5C518" transform="translate(50,0)"/>
            <path d="M8,0L9.8,5.8L16,5.8L11,9.2L13,15L8,11.8L3,15L5,9.2L0,5.8L6.2,5.8Z" fill="rgba(245,197,24,0.2)" transform="translate(75,0)"/>
            <path d="M8,0L9.8,5.8L16,5.8L11,9.2L13,15L8,11.8L3,15L5,9.2L0,5.8L6.2,5.8Z" fill="rgba(245,197,24,0.2)" transform="translate(100,0)"/>
          </svg>
          <div class="ticket__school">Sec. Montmorency</div>
          <div class="ticket__meta">Laval · Promotion 2027</div>
        </div>
        <div class="ticket__stub">NEXUS</div>
      </div>
    </div>
  </div>

</div><!-- end card-wrap -->

</body>
</html>
